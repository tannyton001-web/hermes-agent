name: Sync Fork Main with Upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'tannyton001-web/hermes-agent'
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream and sync
        shell: bash
        run: |
          set -euo pipefail

          echo "TRIGGER_EVENT=${{ github.event_name }}"
          LOCAL_SHA=$(git rev-parse --short HEAD)
          echo "LOCAL_MAIN_SHA=$LOCAL_SHA"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git

          fetch_ok=0
          attempts=0
          for i in 1 2 3; do
            attempts="$i"
            echo "::group::Fetch attempt $i"
            if git fetch --prune upstream main; then
              fetch_ok=1
              echo "::endgroup::"
              break
            else
              rc=$?
              echo "::endgroup::"
              echo "Attempt $i failed (exit=$rc)"
            fi
            if [ "$i" -lt 3 ]; then
              sleep 15
            fi
          done

          echo "FETCH_ATTEMPTS=$attempts"
          if [ "$fetch_ok" -ne 1 ]; then
            echo "FETCH_STATUS=FAIL"
            echo "FATAL: upstream fetch failed after $attempts attempts"
            exit 1
          fi
          echo "FETCH_STATUS=PASS"

          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "UPSTREAM_MAIN_SHA=$UPSTREAM_SHA"

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "BEHIND_COUNT=$BEHIND"
          echo "AHEAD_COUNT=$AHEAD"

          if [ "$AHEAD" -gt 0 ]; then
            echo "MERGE_ACTION=REVIEW_DIVERGED"
            echo "FATAL: fork main is $AHEAD commits ahead of upstream — not an exact mirror"
            exit 1
          fi

          if [ "$BEHIND" -eq 0 ]; then
            echo "MERGE_ACTION=NO_ACTION"
          else
            git merge upstream/main --ff-only
            echo "MERGE_ACTION=FAST_FORWARD"
            echo "Synced $BEHIND commits"
            git push origin main
            echo "PUSH_ACTION=pushed"
          fi

          git fetch origin main
          LOCAL_SHA=$(git rev-parse --short HEAD)
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          ORIGIN_SHA=$(git rev-parse --short origin/main)
          echo "ORIGIN_MAIN_SHA_AFTER_PUSH=$ORIGIN_SHA"

          MIRROR_OK=1
          if [ "$LOCAL_SHA" != "$UPSTREAM_SHA" ]; then
            echo "LOCAL_MISMATCH: local=$LOCAL_SHA upstream=$UPSTREAM_SHA"
            MIRROR_OK=0
          fi
          if [ "$ORIGIN_SHA" != "$UPSTREAM_SHA" ]; then
            echo "ORIGIN_MISMATCH: origin=$ORIGIN_SHA upstream=$UPSTREAM_SHA"
            MIRROR_OK=0
          fi

          if [ "$MIRROR_OK" -eq 1 ]; then
            echo "EXACT_MIRROR_STATUS=PASS"
          else
            echo "EXACT_MIRROR_STATUS=FAIL"
            exit 1
          fi
