name: Sync Fork Main with Upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'tannyton001-web/hermes-agent'
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream and sync
        shell: bash
        run: |
          set -euo pipefail

          echo "TRIGGER_EVENT=${{ github.event_name }}"
          echo "LOCAL_MAIN_SHA=$(git rev-parse --short HEAD)"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git

          fetch_ok=0
          attempts=0
          for i in 1 2 3; do
            attempts="$i"
            echo "::group::Fetch attempt $i"
            git fetch --prune upstream main
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              fetch_ok=1
              break
            fi
            echo "Attempt $i failed (exit=$rc), retrying in 15s..."
            sleep 15
          done

          echo "FETCH_ATTEMPTS=$attempts"
          echo "FETCH_OK=$fetch_ok"

          if [ "$fetch_ok" -ne 1 ]; then
            echo "FATAL: upstream fetch failed after $attempts attempts"
            exit 1
          fi

          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "UPSTREAM_MAIN_SHA=$UPSTREAM_SHA"

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "BEHIND_COUNT=$BEHIND"

          if [ "$BEHIND" -eq 0 ]; then
            echo "MERGE_ACTION=NO_ACTION"
            echo "Already up to date."
            exit 0
          fi

          git merge upstream/main --ff-only
          echo "MERGE_ACTION=FAST_FORWARD"
          echo "Synced $BEHIND commits"

          git push origin main
          echo "PUSH_ACTION=pushed"

          git fetch origin main
          ORIGIN_SHA=$(git rev-parse --short origin/main)
          echo "ORIGIN_MAIN_SHA_AFTER_PUSH=$ORIGIN_SHA"

          if [ "$ORIGIN_SHA" = "$UPSTREAM_SHA" ]; then
            echo "EXACT_MIRROR_STATUS=PASS"
          else
            echo "EXACT_MIRROR_STATUS=FAIL"
            echo "FATAL: origin/main ($ORIGIN_SHA) != upstream/main ($UPSTREAM_SHA)"
            exit 1
          fi
