name: Sync Fork Main with Upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'tannyton001-web/hermes-agent'
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Sync if behind
        id: sync
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "status=NO_ACTION" >> $GITHUB_OUTPUT
          else
            git merge upstream/main --ff-only
            echo "status=SYNCED" >> $GITHUB_OUTPUT
          fi

      - name: Push to fork (skip CI on sync commits)
        if: steps.sync.outputs.status == 'SYNCED'
        run: |
          git push origin main
